name: CI

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite strips the types on the way to js/main.js without ever checking them, so until
      # this step existed nothing in the project compiled the TypeScript. It is cheap and it
      # fails on the annotations themselves, before the tests have to run anything.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The check that matters most. js/main.js is a committed build artifact and it is what
      # ComfyUI actually serves - src/main.ts never reaches a user. It is minified, so a
      # divergence is invisible in review. Nothing else in the project detects it.
      - name: Bundle is reproducible from source
        run: |
          npm run build
          if ! git diff --quiet -- js/; then
            echo "::error::js/main.js does not match a fresh build of src/main.ts."
            echo "Run 'npm run build' and commit the result - users run the committed bundle,"
            echo "not the TypeScript, so the two must not drift."
            git diff --stat -- js/
            exit 1
          fi
          echo "js/main.js reproduces exactly from src/main.ts"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned to the version .pre-commit-config.yaml declares, so CI and the pre-commit hook
      # cannot disagree about what passes.
      - name: Install ruff
        run: pip install ruff==0.4.9

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      # setuptools' src-layout auto-discovery used to select src/components and publish five
      # unused .vue files as a top-level `components` package - shipping none of the actual
      # extension and a name that collides with anything else called `components`. Nothing
      # detected that, so assert the build stays free of importable top-level packages.
      - name: Wheel ships no stray top-level package
        run: |
          pip install --quiet build setuptools wheel
          python -m build --wheel --no-isolation --outdir dist-check
          python - <<'PY'
          import glob, zipfile

          wheel = glob.glob('dist-check/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          stray = sorted({
              n.split('/')[0] for n in names
              if '/' in n and not n.split('/')[0].endswith('.dist-info')
          })
          if stray:
              print(f'::error::the wheel ships top-level package(s): {stray}')
              print('ComfyUI loads this extension from custom_nodes/, not site-packages, so')
              print('the wheel should carry metadata only. Check [tool.setuptools] packages.')
              raise SystemExit(1)
          print(f'{wheel.split("/")[-1]} carries metadata only, as intended')
          PY

      # The extension is frontend-only: __init__.py must import with no ComfyUI present, and
      # must still export NODE_CLASS_MAPPINGS or ComfyUI reports it as an import failure.
      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys

          spec = importlib.util.spec_from_file_location('housekeeper', '__init__.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.WEB_DIRECTORY == './js', module.WEB_DIRECTORY
          # ComfyUI checks `is not None`, so an empty dict is what keeps it from logging
          # "(IMPORT FAILED)" next to this pack on every startup.
          assert module.NODE_CLASS_MAPPINGS is not None
          assert module.NODE_DISPLAY_NAME_MAPPINGS is not None
          assert pathlib.Path('js/main.js').is_file(), 'WEB_DIRECTORY has no bundle to serve'
          print('__init__.py imports standalone; WEB_DIRECTORY resolves to a real bundle')
          PY
