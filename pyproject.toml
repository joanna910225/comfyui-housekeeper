[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "housekeeper"
version = "0.6.2"
description = "A tool that organizes workflow nodes into clean, user-friendly layouts"
authors = [
  {name = "Feifei Rong", email = "feifei.rong2@gmail.com"}
]
readme = "README.md"
license = {text = "MIT license"}
requires-python = ">=3.10"
classifiers = []
dependencies = [

]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/joanna910225/comfyui-housekeeper"
BugTracker = "https://github.com/joanna910225/comfyui-housekeeper/issues"
Documentation = "https://github.com/joanna910225/comfyui-housekeeper/wiki"


[tool.comfy]
PublisherId = "joanna910225"
DisplayName = "HouseKeeper"
Icon = ""
Tags = []
Repository = "https://github.com/joanna910225/comfyui-housekeeper"
includes = ["js"]

[tool.setuptools]
# ComfyUI loads a custom node by scanning custom_nodes/ for a directory, not by importing a
# package from site-packages - so a pip install can never produce a working install of this
# extension no matter what the wheel contains. Installation is "clone into custom_nodes",
# as the README says, or via the ComfyUI Registry.
#
# Declaring no packages is therefore the honest result, and it stops setuptools' src-layout
# auto-discovery producing a wrong one. Because a src/ directory exists, discovery used to
# select src/components as the sole package and publish five unused .vue files as a
# top-level `components` module - shipping no __init__.py, no js/main.js, and a name that
# would collide with any other package called `components` on sys.path.
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
# Not `files = "."`: the checkout directory name contains a hyphen, so mypy aborts with
# "contains __init__.py but is not a valid Python package name" before checking anything.
files = ["__init__.py"]

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py310"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
